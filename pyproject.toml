[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "marking-erp"
version = "0.1.0"
description = "Marking ERP infrastructure; business modules are not yet enabled"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0", "uvicorn==0.54.0", "SQLAlchemy==2.1.6",
  "alembic==1.20.1", "psycopg[binary]==3.3.6", "pydantic-settings==2.16.1",
  "cryptography==50.0.2", "pyotp==2.10.0", "reportlab==4.4.9",
  "httpx==0.28.1", "openpyxl==3.1.5", "xlsxwriter==3.2.9",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pymupdf==1.26.6", "pypdf==6.10.0", "zxing-cpp==3.1.1", "pillow==12.3.0"]
browser = ["playwright==1.55.0"]

[project.scripts]
marking-erp = "marking_erp.cli:main"
marking-erp-backup = "marking_erp.backup_cli:main"
marking-erp-nk-check = "marking_erp.nk_read_cli:main"
marking-erp-nk-pilot = "marking_erp.nk_pilot_cli:main"
marking-erp-nk-review = "marking_erp.nk_review_cli:main"
marking-erp-service = "marking_erp.service:main"

[tool.setuptools.packages.find]
include = ["marking_erp*"]

[tool.setuptools.package-data]
marking_erp = ["data/*.json", "migrations/*.sql", "migrations/*.mako", "static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires a disposable PostgreSQL database", "browser: requires PostgreSQL and installed Chromium"]

