name: Core PostgreSQL
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp_test
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_test -d erp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ERP_TEST_DATABASE_URL: postgresql+psycopg://erp_test:isolated_ci_only@127.0.0.1:5432/erp_test
      ERP_BROWSER_TESTS: '1'
      ERP_PG_BIN_DIR: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[test,browser]'
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get install -y postgresql-client-16
      - run: python -m pytest -q --junitxml=test-results.xml
      - name: Install deployment smoke dependencies
        run: sudo apt-get install -y nginx openssl fonts-dejavu-core
      - name: Build pinned offline release
        run: python scripts/build_release.py --sha "$GITHUB_SHA" --output release-dist
      - name: Install offline release into fresh runner
        run: |
          mkdir -p /tmp/erp-bundle
          tar -xzf release-dist/marking-erp-"$GITHUB_SHA".tar.gz -C /tmp/erp-bundle
          sudo python3.12 /tmp/erp-bundle/marking-erp-"$GITHUB_SHA"/install-release.py --bundle /tmp/erp-bundle/marking-erp-"$GITHUB_SHA"
      - name: Test real systemd HTTPS and recovery
        run: |
          export ERP_RELEASE_SHA="$GITHUB_SHA"
          sudo --preserve-env=GITHUB_ACTIONS,ERP_TEST_DATABASE_URL,ERP_RELEASE_SHA /opt/marking-erp/releases/"$GITHUB_SHA"/venv/bin/python scripts/smoke_deploy.py
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu24-python312-offline-${{ github.sha }}
          path: release-dist
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: test-results/ui
          retention-days: 14

