name: Core PostgreSQL
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp_test
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_test -d erp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ERP_TEST_DATABASE_URL: postgresql+psycopg://erp_test:isolated_ci_only@127.0.0.1:5432/erp_test
      ERP_BROWSER_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[test,browser]'
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: test-results/ui
          retention-days: 14

